name: CI

on:
  pull_request:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    name: Tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.2
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - run: bun test

  nix:
    name: Nix package
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: cachix/install-nix-action@448cde739abec1eaf0646249e3d25bb8d9bc7702 # v31.11.2
        with:
          extra_nix_config: experimental-features = nix-command flakes
      - run: nix flake check
      - run: nix build
      - run: ./result/bin/omp-sync-server --help
      - name: Exercise packaged local administration
        shell: bash
        run: |
          state="$(mktemp -d)"
          trap 'rm -rf "$state"' EXIT
          ./result/bin/omp-sync-server pair --name ci --data-dir "$state" > /dev/null
          ./result/bin/omp-sync-server backup "$state/backup.db" --data-dir "$state"
          ./result/bin/omp-sync-server rotate-epoch --data-dir "$state"

  containers:
    name: Containers (Compose)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.2
      - name: Build and exercise both containers without retagging deployment images
        env:
          OMP_SYNC_IMAGE: omp-sync-protected-sync:keep
          OMP_SYNC_BROKER_IMAGE: omp-sync-protected-broker:keep
        run: |
          docker pull oven/bun:1.4.2
          docker tag oven/bun:1.4.2 "$OMP_SYNC_IMAGE"
          docker tag oven/bun:1.4.2 "$OMP_SYNC_BROKER_IMAGE"
          protected="$(docker image inspect --format '{{.Id}}' oven/bun:1.4.2)"
          bun run smoke:compose
          test "$(docker image inspect --format '{{.Id}}' "$OMP_SYNC_IMAGE")" = "$protected"
          test "$(docker image inspect --format '{{.Id}}' "$OMP_SYNC_BROKER_IMAGE")" = "$protected"
          test -z "$(docker image ls --filter 'reference=omp-sync-smoke-*:smoke' --quiet)"
          docker image rm "$OMP_SYNC_IMAGE" "$OMP_SYNC_BROKER_IMAGE"
      - name: Reject failed pulls even when cached images exist
        env:
          OMP_SYNC_IMAGE: 127.0.0.1:1/omp-sync-pull-server:missing
          OMP_SYNC_BROKER_IMAGE: 127.0.0.1:1/omp-sync-pull-broker:missing
          OMP_SYNC_PUBLISH_HOST: 127.0.0.1
          OMP_SYNC_PUBLISH_PORT: "0"
        run: |
          project="omp-sync-pull-failure-${GITHUB_RUN_ID}"
          compose=(docker compose --project-name "$project" -f docker-compose.yml -f docker-compose.images.yml)
          cleanup() {
            status=$?
            if ! "${compose[@]}" down --volumes --remove-orphans; then
              [ "$status" -ne 0 ] || status=1
            fi
            if ! docker image rm "$OMP_SYNC_IMAGE" "$OMP_SYNC_BROKER_IMAGE"; then
              [ "$status" -ne 0 ] || status=1
            fi
            exit "$status"
          }
          docker tag oven/bun:1.4.2 "$OMP_SYNC_IMAGE"
          docker tag oven/bun:1.4.2 "$OMP_SYNC_BROKER_IMAGE"
          trap cleanup EXIT
          if "${compose[@]}" up -d --no-build --pull always --wait --wait-timeout 15; then
            echo '::error::An unavailable registry must not start cached images.'
            exit 1
          fi
          test -z "$("${compose[@]}" ps --all --quiet)"

  images:
    name: Container images
    needs: [check, nix, containers]
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/images.yml
    with:
      publish: ${{ github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')) }}
