name: Images

on:
  workflow_call:
    inputs:
      publish:
        description: Publish images after the caller's CI checks succeed
        required: true
        type: boolean

permissions:
  contents: read

jobs:
  images:
    name: Image (${{ matrix.image }})
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: server
            dockerfile: Dockerfile
            suffix: ''
          - image: broker
            dockerfile: Dockerfile.broker
            suffix: '-broker'
    steps:
      - name: Validate publication policy and release tag
        id: policy
        shell: bash
        env:
          REQUESTED_PUBLISH: ${{ inputs.publish }}
          EVENT_NAME: ${{ github.event_name }}
          REF: ${{ github.ref }}
          REPOSITORY: ${{ github.repository }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          publish=false
          release=false
          default_branch=false
          version=''

          if [[ "$REF" == refs/tags/v* ]]; then
            version="${REF#refs/tags/v}"
            semver='^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-([0-9A-Za-z-]+)(\.[0-9A-Za-z-]+)*)?$'
            if [[ ! "$version" =~ $semver || ${#version} -gt 128 ]]; then
              echo '::error::Release tags must be vX.Y.Z with an optional SemVer prerelease (no build metadata).'
              exit 1
            fi
            if [[ "$version" == *-* ]]; then
              IFS='.' read -r -a identifiers <<< "${version#*-}"
              for identifier in "${identifiers[@]}"; do
                if [[ "$identifier" =~ ^0[0-9]+$ ]]; then
                  echo '::error::Numeric prerelease identifiers must not contain leading zeroes.'
                  exit 1
                fi
              done
            fi
            release=true
          fi

          if [[ "$REQUESTED_PUBLISH" == true ]]; then
            # Only CI's push/manual runs on main or validated release tags may publish.
            # In particular, neither pull_request nor pull_request_target can log in.
            if [[ "$EVENT_NAME" != push && "$EVENT_NAME" != workflow_dispatch ]]; then
              echo '::error::Publishing requires a push or workflow_dispatch event.'
              exit 1
            fi
            if [[ "$REF" != refs/heads/main && "$release" != true ]]; then
              echo '::error::Publishing requires main or a validated vX.Y.Z release tag.'
              exit 1
            fi
            publish=true
          fi

          if [[ "$REF" == refs/heads/main && "$DEFAULT_BRANCH" == main ]]; then
            default_branch=true
          fi
          {
            printf 'publish=%s\n' "$publish"
            printf 'release=%s\n' "$release"
            printf 'default_branch=%s\n' "$default_branch"
            printf 'version=%s\n' "$version"
            printf 'repository=%s\n' "${REPOSITORY,,}"
          } >> "$GITHUB_OUTPUT"

      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up QEMU
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
        with:
          platforms: arm64

      - name: Set up Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Generate image metadata
        id: metadata
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/${{ steps.policy.outputs.repository }}${{ matrix.suffix }}
          # Never let a stable release or prerelease implicitly move latest.
          flavor: latest=false
          tags: |
            type=raw,value=latest,enable=${{ steps.policy.outputs.publish == 'true' && steps.policy.outputs.default_branch == 'true' }}
            type=raw,value=main,enable=${{ steps.policy.outputs.publish == 'true' && steps.policy.outputs.default_branch == 'true' }}
            type=sha,format=long
            type=semver,pattern={{version}},value=${{ steps.policy.outputs.version }},enable=${{ steps.policy.outputs.release == 'true' }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.licenses=MIT

      - name: Log in to GHCR
        if: steps.policy.outputs.publish == 'true'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build multi-platform image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64,linux/arm64
          push: ${{ steps.policy.outputs.publish == 'true' }}
          tags: ${{ steps.metadata.outputs.tags }}
          labels: ${{ steps.metadata.outputs.labels }}
          cache-from: type=gha,scope=images-${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=images-${{ matrix.image }}
          provenance: ${{ steps.policy.outputs.publish == 'true' && 'mode=max' || 'false' }}
          sbom: ${{ steps.policy.outputs.publish == 'true' }}
